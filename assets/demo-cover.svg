  </g>

  <g fill="none" stroke="#a8b7cb" stroke-width="8" opacity=".72">
    <path d="M778 182h364M778 276h364M778 370h364M778 464h364"/>
    <path d="M842 126v444M946 126v444M1054 126v444"/>
  </g>
  <path d="M786 512 870 430 954 472 1048 326 1142 260" fill="none" stroke="#fff" stroke-width="14"/>
