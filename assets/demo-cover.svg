    <text x="1128" y="45" font-size="16" text-anchor="end" opacity=".82">FTTH network engineering</text>
  </g>

  <rect x="26" y="100" width="710" height="500" fill="url(#scene)" stroke="#393939"/>
  <rect x="752" y="100" width="422" height="500" fill="url(#map)" stroke="#8d8d8d"/>

  <g opacity=".9">
