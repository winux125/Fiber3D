      <path d="m100 370 82-38 76 42-82 40z"/>
      <path d="m270 308 98-46 92 48-98 48z"/>
      <path d="m430 424 105-48 96 54-104 48z"/>
      <path d="m170 510 86-40 80 44-86 40z"/>
