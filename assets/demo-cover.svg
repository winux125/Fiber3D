<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">FiberPlan 3D — демонстрационное видео</title>
  <desc id="description">Обложка видео с 3D-моделью, картой и кнопкой воспроизведения</desc>
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f16"/>
      <stop offset="1" stop-color="#162238"/>
    </linearGradient>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#dce7f5"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="20" fill="#161616"/>
  <rect x="1" y="1" width="1198" height="628" rx="19" fill="none" stroke="#525252"/>
  <rect x="0" y="0" width="1200" height="74" rx="20" fill="#0f62fe"/>
  <rect y="54" width="1200" height="20" fill="#0f62fe"/>

  <g fill="#fff" font-family="Arial, Helvetica, sans-serif">
